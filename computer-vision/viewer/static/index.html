<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Strider vision</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Strider vision</h1>
      <p class="tagline">Bench webcam for the collar camera</p>
    </div>
    <p id="status-pill" class="pill" data-state="connecting" role="status" aria-live="polite" aria-atomic="true">Connecting</p>
    <p class="stream-url">
      <span class="eyebrow">Stream</span>
      <span id="stream-url"></span>
    </p>
  </header>

  <main>
    <div class="toolbar">
      <fieldset class="source-pick">
        <legend>Video source</legend>
        <div class="choice-row">
          <label class="choice" for="source-webcam">
            <input type="radio" id="source-webcam" name="source" value="webcam" checked>
            Webcam
          </label>
          <label class="choice" for="source-esp32">
            <input type="radio" id="source-esp32" name="source" value="esp32">
            ESP32
          </label>
        </div>
      </fieldset>
      <div class="mode-pick">
        <label for="mode">Guidance mode</label>
        <select id="mode" name="mode">
          <option value="general" selected>General guidance</option>
          <option value="crosswalk">Crosswalk assistance</option>
          <option value="depth">Depth perception</option>
        </select>
      </div>
    </div>

    <form id="camera-form" autocomplete="off">
      <label for="camera-url">Camera address</label>
      <div class="controls">
        <input
          id="camera-url"
          name="url"
          type="text"
          inputmode="url"
          spellcheck="false"
          autocapitalize="off"
          placeholder="http://192.168.4.1 or http://192.168.1.20:81/stream"
          required>
        <button type="submit">Connect</button>
      </div>
    </form>

    <p id="cue" class="cue" role="status" aria-live="polite" aria-atomic="true"></p>

    <section class="stage" aria-label="Live camera view">
      <img id="video" alt="Live camera" aria-describedby="cue detail">
    </section>
    <p id="detail" class="detail" role="status" aria-live="polite" hidden></p>
  </main>

  <noscript>
    <p class="detail">This viewer needs JavaScript to connect to the camera.</p>
  </noscript>
  <script src="/static/app.js"></script>
</body>
</html>
